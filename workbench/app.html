<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
  tailwind.config = {
    plugins: [
      function ({ addUtilities }) {
        addUtilities({
          ".scrollbar-thin": {
            scrollbarWidth: "thin",
          },
          ".scrollbar-none": {
            scrollbarWidth: "none",
          },
          ".scrollbar-thumb-zinc": {
            scrollbarColor: "#3f3f46 transparent",
          },
        });
      },
    ],
  };
</script>

</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col">

  <!-- Top Bar -->
  <header class="z-40 bg-black/70 backdrop-blur border-b border-white/10 flex flex-row flex-wrap justify-around">
    <div class="max-w-6xl  px-4 py-3 flex items-center gap-3">
      <a href="https://djsablab.github.io/workbench" class="flex items-center gap-3">
        <img src="../res/assets/wb-logo.png" alt="DJ's Workbench Logo" class="w-7 h-7" />
        <span class="font-semibold text-lg">
          DJ's Workbench
        </span></a>
    </div>
    <div class="border-t border-white/10 flex justify-center max-w-6xl px-4 py-3 flex items-center gap-3 flex-wrap">
      <a href="https://djsablab.github.io" class="block font-medium hover:underline flex items-center gap-1">
        <ion-icon name="home-outline"></ion-icon>Home
      </a>
      <a href="https://djsablab.github.io/workbench/about" class="block font-medium hover:underline flex items-center gap-1">
        <ion-icon name="help-outline"></ion-icon>About
      </a>
      <a href="https://djsablab.github.io/links" class="block font-medium hover:underline flex items-center gap-1">
        <ion-icon name="call-outline"></ion-icon>Contact
      </a>
    </div>
  </header>

  <main class="flex-1 max-w-5xl mx-auto px-4 py-6 space-y-8">

    <!-- App Header -->
    <section class="flex flex-col sm:flex-row items-center sm:items-start gap-6 text-center sm:text-left">
      <img id="icon" class="w-28 h-28 rounded-2xl bg-zinc-800" />

      <div class="space-y-2">
        <h1 class="text-2xl font-semibold flex flex-wrap gap-2 justify-center sm:justify-start">
          <span id="name"></span>
          <span id="stars" class="text-yellow-400"></span>
        </h1>

        <p id="developer" class="text-sm text-zinc-400"></p>
        <p id="meta" class="text-sm text-zinc-500"></p>

        <div class="flex flex-wrap gap-3 justify-center sm:justify-start pt-3">
          <button id="downloadBtn" class="px-5 py-2 rounded-full bg-blue-500 font-medium active:scale-95 transition">
            Download
          </button>

          <button id="view_on_github"
            class="px-5 py-2 rounded-full border border-white/10 bg-zinc-800 hover:bg-zinc-700 active:scale-95 transition">
            View on GitHub
          </button>
        </div>
      </div>
    </section>

    <!-- Screenshots -->
    <section class="relative">
      <!-- Left arrow -->
      <button id="ssPrev" class="hidden sm:flex absolute left-0 top-1/2 -translate-y-1/2 z-10
           bg-black/60 hover:bg-black/80 backdrop-blur
           w-10 h-10 rounded-full items-center justify-center
           border border-white/10">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>

      <!-- Screenshots -->
      <div id="screenshots" class="flex gap-4 overflow-x-auto snap-x snap-mandatory pb-2 scrollbar-thin scrollbar-thumb-zinc scroll-smooth">
      </div>

      <!-- Right arrow -->
      <button id="ssNext" class="hidden sm:flex absolute right-0 top-1/2 -translate-y-1/2 z-10
           bg-black/60 hover:bg-black/80 backdrop-blur
           w-10 h-10 rounded-full items-center justify-center
           border border-white/10">

        <ion-icon name="arrow-forward-outline"></ion-icon>
      </button>
    </section>


    <!-- About -->
    <section>
      <h2 class="text-xl font-semibold mb-2">About this app</h2>
      <p id="desc" class="text-zinc-300 leading-relaxed"></p>
    </section>
  </main>

  <!-- DOWNLOAD MODAL -->
  <div id="downloadModal" class="fixed inset-0 z-50 hidden bg-black/70 flex items-center justify-center p-4 ">
    <div class="bg-zinc-900 w-full max-w-md rounded-xl p-5 space-y-3 ">
      <h2 id="mod-title" class="text-xl font-semibold"></h2>
      <p class="text-sm text-zinc-400">
        Select a version to download.
      </p>

      <div id="releaseList" class="max-h-[60vh] overflow-y-auto space-y-4 flex flex-col-reverse">
        Loading releases…
      </div>

      <button id="closeModal" class="w-full py-2 rounded-lg border border-white/10 text-zinc-300 hover:bg-zinc-800">
        Close
      </button>
    </div>
  </div>

  <!-- IMAGE PREVIEW MODAL -->
  <div id="previewModal" class="fixed inset-0 z-50 hidden bg-black/90 flex items-center justify-center p-4">
    <img id="previewImage" class="max-w-full max-h-full rounded-xl" />
  </div>

  <script src="../res/js/workbench.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
