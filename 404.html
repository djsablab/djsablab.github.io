<!doctype html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="404 page for djsablab.github.io" />
  <title>Ah snap 404 again :(</title>
  <link rel="stylesheet" href="./r-404/css/style.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            accent: "#b71c1c",
            gold: "#C9A24D",
          },
        },
      },
    };
  </script>
</head>

<body class="bg-[#FAFAFA] dark:bg-[#121212] text-[#1C1C1C] dark:text-[#EDEDED]">

  <main id="sections" class="h-screen scroll-smooth snap-y snap-mandatory">
    <!-- LANDING -->
    <section id="landing"
      class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative overflow-hidden snap-start">
      <!-- Particles -->
      <div class="absolute inset-0 -z-10 pointer-events-none">
        <span class="particle left-[20%] top-[30%]"></span>
        <span class="particle left-[70%] top-[40%]"></span>
        <span class="particle left-[40%] top-[70%]"></span>
      </div>
      <h1
        class="text-5xl md:text-6xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-accent via-red-700 to-red-800 animate-gradient">
        Oh snap :(
      </h1>
      <p class="text-lg md:text-xl text-[#616161] dark:text-[#9E9E9E] max-w-xl mb-10 text-wrap">
        The page you're looking for doesn't exist. Please go back to home below to find your way.
      </p>
      <div class="flex gap-4 flex-wrap justify-center">
        <button data-target="about" type="button" id="rt-button"
          class="relative overflow-hidden px-8 py-4 ripple-btn rounded-xl bg-accent text-white font-semibold shadow-lg transform transition-transform hover:scale-105">
          Go to Home
        </button>
      </div>
    </section>

  <script src="./r-404/js/main.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
