<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../res/assets/link.png" />
  <title>My Links</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- Icons (Ionicons) -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <!-- Custom styles -->
  <style>
    .link-btn {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .link-btn:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
    }

    /* Theme toggle animation */
    .theme-animate {
      transition: transform 0.4s ease, opacity 0.3s ease;
    }
    .rotate {
      transform: rotate(180deg) scale(1.1);
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-slate-200 dark:from-slate-900 dark:to-slate-800 flex items-center justify-center text-slate-900 dark:text-white transition-colors duration-500">

  <main class="w-full max-w-sm px-6">
    <!-- Theme Toggle -->
    <div class="flex justify-end mb-4">
      <button id="themeToggle" aria-label="Toggle theme"
        class="w-11 h-11 flex items-center justify-center rounded-full bg-black/10 dark:bg-white/10 backdrop-blur hover:scale-110 transition">
        <ion-icon id="themeIcon" name="moon" class="theme-animate text-xl leading-none"></ion-icon>
      </button>
    </div>

    <!-- Profile -->
    <div class="text-center mb-8">
      <!--<img
        src=""
        alt="Profile"
        class="w-28 h-28 rounded-full mx-auto mb-4 border-4 border-white/20"
      /> -->
      <h1 class="text-2xl font-bold">@djsablab</h1>
      <p class="text-slate-600 dark:text-white/70 mt-1">Frontend Developer • Mobile Developer</p>
    </div>

    <!-- Links -->
    <div id="links" class="space-y-4"></div>

    <!-- Footer -->
    <p class="text-center text-xs text-slate-500 dark:text-white/40 mt-10">
      © 2026 DJ Sablab • Made with ❤️
    </p>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const links = [
        { name: 'YouTube', url: 'https://djsablab.github.io/links/youtube', color: 'bg-red-500', icon: 'logo-youtube' },
        { name: 'LinkedIn', url: 'https://djsablab.github.io/links/linkedin', color: 'bg-blue-500', icon: 'logo-linkedin' },
        { name: 'GitHub', url: 'https://djsablab.github.io/links/github', color: 'bg-gray-700', icon: 'logo-github' },
        { name: 'My Website', url: 'https://djsablab.github.io', color: 'bg-green-500', icon: 'globe-outline' },
      ];

      const container = document.getElementById('links');
      links.forEach(link => {
        const a = document.createElement('a');
        a.href = link.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = `link-btn flex items-center justify-center gap-3 w-full py-4 rounded-xl font-semibold text-white ${link.color} hover:brightness-110`;
        a.innerHTML = `<ion-icon name="${link.icon}" class="text-xl"></ion-icon><span>${link.name}</span>`;
        container.appendChild(a);
      });

      const toggleBtn = document.getElementById('themeToggle');
      const icon = document.getElementById('themeIcon');
      const root = document.documentElement;

      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const storedTheme = localStorage.getItem('theme');

      const setTheme = (isDark) => {
        root.classList.toggle('dark', isDark);
        icon.setAttribute('name', isDark ? 'sunny' : 'moon');
        icon.classList.add('rotate');
        setTimeout(() => icon.classList.remove('rotate'), 400);
      };

      if (storedTheme) {
        setTheme(storedTheme === 'dark');
      } else {
        setTheme(prefersDark);
      }

      toggleBtn.addEventListener('click', () => {
        const isDark = !root.classList.contains('dark');
        setTheme(isDark);
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    });
  </script>

</body>
</html>
